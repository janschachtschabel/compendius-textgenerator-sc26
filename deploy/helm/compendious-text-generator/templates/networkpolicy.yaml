{{- if .Values.networkPolicy.enabled }}
{{- $root := . }}
{{- $dnsRule := dict "ports" (list (dict "port" 53 "protocol" "UDP") (dict "port" 53 "protocol" "TCP")) }}
{{- if .Values.networkPolicy.dns }}
{{- $_ := set $dnsRule "to" .Values.networkPolicy.dns }}
{{- end }}
# Die API: Port http nur aus publicFrom, Port internal nur aus internalFrom; ausgehend DNS und networkPolicy.egress.api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kompendium.apiName" . }}
  labels:
    {{- include "kompendium.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      {{- include "kompendium.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    {{- with .Values.networkPolicy.publicFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.internalFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: internal
          protocol: TCP
    {{- end }}
  egress:
    {{- toYaml (list $dnsRule) | nindent 4 }}
    {{- with .Values.networkPolicy.egress.api }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.tracing.otlpEndpoint }}
    # die Spans an den Sammler (tracing.otlpEndpoint, D115)
    - ports:
        - port: {{ .Values.tracing.collectorPort }}
          protocol: TCP
      {{- with .Values.tracing.collectorTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- range $key := list "zimUpdater" "lehrplanUpdater" "wikidataUpdater" "gndUpdater" }}
{{- if (index $root.Values.updaters $key).enabled }}
{{- $component := include "kompendium.updaterKind" $key }}
---
# {{ $component }}: nichts verbindet sich zu ihm; ausgehend DNS und networkPolicy.egress.{{ $key }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kompendium.updaterName" (dict "root" $root "key" $key) }}
  labels:
    {{- include "kompendium.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  podSelector:
    matchLabels:
      {{- include "kompendium.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- toYaml (list $dnsRule) | nindent 4 }}
    {{- with (index $root.Values.networkPolicy.egress $key) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
