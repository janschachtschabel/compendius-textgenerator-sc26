# Tests der Alarmregeln: promtool test rules monitoring/alerts_test.yml
# (im Container: docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool prom/prometheus:v3.14.0 test rules /m/alerts_test.yml)
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: Verfügbarkeit und LLM
    interval: 1m
    input_series:
      - series: 'up{job="kompendium", instance="api:8000"}'
        values: "1x10 0x20"
      - series: 'kompendium_zim_ready{job="kompendium", instance="api:8000"}'
        values: "1 1 0x30"
      - series: 'kompendium_llm_enabled{job="kompendium", instance="api:8000"}'
        values: "1x30"
      - series: 'kompendium_llm_tokens_used_today{job="kompendium", instance="api:8000"}'
        values: "1000x30"
      - series: 'kompendium_llm_daily_budget_tokens{job="kompendium", instance="api:8000"}'
        values: "2000000x30"
    alert_rule_test:
      - eval_time: 14m
        alertname: KompendiumDown
        exp_alerts: []
      - eval_time: 17m
        alertname: KompendiumDown
        exp_alerts:
          - exp_labels: { severity: critical, job: kompendium, instance: "api:8000" }
            exp_annotations:
              summary: Kompendium-API nicht erreichbar
              description: Prometheus erreicht /metrics seit fünf Minuten nicht.
      - eval_time: 10m
        alertname: KompendiumNotReady
        exp_alerts: []
      - eval_time: 20m
        alertname: KompendiumNotReady
        exp_alerts:
          - exp_labels: { severity: critical, job: kompendium, instance: "api:8000" }
            exp_annotations:
              summary: Pflichtarchive fehlen, /ready meldet 503
              description: kompendium_zim_required_missing nennt die Zahl; Sync-Job und active.json prüfen.
      - eval_time: 25m
        alertname: KompendiumLlmBudgetNearlySpent
        exp_alerts: []

  - name: Fehlerquote
    interval: 1m
    input_series:
      - series: 'kompendium_http_requests_total{job="kompendium", instance="api:8000", method="POST", route="/api/v2/compendium", status="200"}'
        values: "0+10x30"
      - series: 'kompendium_http_requests_total{job="kompendium", instance="api:8000", method="POST", route="/api/v2/compendium", status="500"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: KompendiumHighErrorRate
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Mehr als 5 % der Anfragen enden mit 5xx
              description: Log der API prüfen; 502 heißt edu-sharing, 503 fehlende Archive.

  - name: Alter von Sync und Lehrplan-Cache
    interval: 1d
    input_series:
      - series: 'kompendium_zim_sync_last_run_timestamp_seconds{job="kompendium", instance="api:8000"}'
        values: "0x45"
      - series: 'kompendium_lehrplan_cache_harvested_timestamp_seconds{job="kompendium", instance="api:8000"}'
        values: "0x45"
    alert_rule_test:
      - eval_time: 30d
        alertname: KompendiumZimSyncStale
        exp_alerts: []
      - eval_time: 36d
        alertname: KompendiumZimSyncStale
        exp_alerts:
          - exp_labels: { severity: warning, job: kompendium, instance: "api:8000" }
            exp_annotations:
              summary: Der ZIM-Sync ist seit mehr als 35 Tagen nicht gelaufen
              description: Der Updater-Sidecar läuft nicht oder hängt.
      - eval_time: 36d
        alertname: KompendiumLehrplanCacheStale
        exp_alerts: []
      - eval_time: 41d
        alertname: KompendiumLehrplanCacheStale
        exp_alerts:
          - exp_labels: { severity: warning, job: kompendium, instance: "api:8000" }
            exp_annotations:
              summary: Der Lehrplan-Cache ist älter als 40 Tage
              description: Der Harvest-Sidecar läuft nicht oder scheitert.

  - name: Hängender ZIM-Sync
    interval: 1m
    input_series:
      # haengt: läuft laut Statusdatei, schreibt aber seit dem Start nicht mehr (abgestürzt, volles Volume)
      - series: 'kompendium_zim_sync_running{job="kompendium", instance="api:8000", fall="haengt"}'
        values: "1x480"
      - series: 'kompendium_zim_sync_status_updated_timestamp_seconds{job="kompendium", instance="api:8000", fall="haengt"}'
        values: "0x480"
      # laeuft: ein langer Download schreibt jede Minute seinen Fortschritt
      - series: 'kompendium_zim_sync_running{job="kompendium", instance="api:8000", fall="laeuft"}'
        values: "1x480"
      - series: 'kompendium_zim_sync_status_updated_timestamp_seconds{job="kompendium", instance="api:8000", fall="laeuft"}'
        values: "0+60x480"
      # ruht: zwischen zwei Läufen ist die Statusdatei alt, das ist normal
      - series: 'kompendium_zim_sync_running{job="kompendium", instance="api:8000", fall="ruht"}'
        values: "0x480"
      - series: 'kompendium_zim_sync_status_updated_timestamp_seconds{job="kompendium", instance="api:8000", fall="ruht"}'
        values: "0x480"
    alert_rule_test:
      - eval_time: 6h
        alertname: KompendiumZimSyncHangs
        exp_alerts: []
      - eval_time: 6h20m
        alertname: KompendiumZimSyncHangs
        exp_alerts:
          - exp_labels: { severity: warning, job: kompendium, instance: "api:8000", fall: haengt }
            exp_annotations:
              summary: Der ZIM-Sync meldet seit sechs Stunden keinen Fortschritt
              description: Laut sync_status.json läuft der Updater, er schreibt aber nicht mehr (abgestürzt, volles Volume oder hängender Download); Log des Sidecars prüfen.

  - name: Fehlerquote beim Erststart (nur /ready meldet 503)
    interval: 1m
    input_series:
      - series: 'kompendium_http_requests_total{job="kompendium", instance="api:8000", method="GET", route="/ready", status="503"}'
        values: "0+2x30"
      - series: 'kompendium_http_requests_total{job="kompendium", instance="api:8000", method="GET", route="/health", status="200"}'
        values: "0+2x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: KompendiumHighErrorRate
        exp_alerts: []

  - name: Fehlerquote hinter vielen Proben (die Hälfte der Kompendien scheitert)
    interval: 1m
    input_series:
      - series: 'kompendium_http_requests_total{job="kompendium", instance="api:8000", method="GET", route="/health", status="200"}'
        values: "0+100x30"
      - series: 'kompendium_http_requests_total{job="kompendium", instance="api:8000", method="POST", route="/api/v2/compendium", status="200"}'
        values: "0+1x30"
      - series: 'kompendium_http_requests_total{job="kompendium", instance="api:8000", method="POST", route="/api/v2/compendium", status="502"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: KompendiumHighErrorRate
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Mehr als 5 % der Anfragen enden mit 5xx
              description: Log der API prüfen; 502 heißt edu-sharing, 503 fehlende Archive.

  - name: LLM nicht erreichbar (alle Hybridanfragen im Regelmodus)
    interval: 1m
    input_series:
      - series: 'kompendium_llm_enabled{job="kompendium", instance="api:8000"}'
        values: "1x40"
      - series: 'kompendium_compendium_requests_total{job="kompendium", instance="api:8000", mode_requested="hybrid-fast", mode_used="rule-based"}'
        values: "0+2x40"
      - series: 'kompendium_compendium_requests_total{job="kompendium", instance="api:8000", mode_requested="hybrid-fast", mode_used="hybrid-fast"}'
        values: "5x40"
    alert_rule_test:
      - eval_time: 5m
        alertname: KompendiumLlmUnavailable
        exp_alerts: []
      - eval_time: 20m
        alertname: KompendiumLlmUnavailable
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Keine Hybridanfrage erreicht das LLM, alle laufen im Regelmodus
              description: Seit 15 Minuten fällt jede Hybridanfrage auf den Regelmodus zurück (b-api nicht erreichbar, Modell fehlt, Antworten mit 401 oder 5xx, Schutzschalter oder Tagesbudget); audit.llm.note der Antworten nennt den Grund.

  - name: LLM teilweise erreichbar
    interval: 1m
    input_series:
      - series: 'kompendium_llm_enabled{job="kompendium", instance="api:8000"}'
        values: "1x40"
      - series: 'kompendium_compendium_requests_total{job="kompendium", instance="api:8000", mode_requested="hybrid-fast", mode_used="rule-based"}'
        values: "0+1x40"
      - series: 'kompendium_compendium_requests_total{job="kompendium", instance="api:8000", mode_requested="hybrid-fast", mode_used="hybrid-fast"}'
        values: "0+1x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: KompendiumLlmUnavailable
        exp_alerts: []

  - name: LLM abgeschaltet (LLM_ENABLED=false)
    interval: 1m
    input_series:
      - series: 'kompendium_llm_enabled{job="kompendium", instance="api:8000"}'
        values: "0x40"
      - series: 'kompendium_compendium_requests_total{job="kompendium", instance="api:8000", mode_requested="hybrid-fast", mode_used="rule-based"}'
        values: "0+2x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: KompendiumLlmUnavailable
        exp_alerts: []
