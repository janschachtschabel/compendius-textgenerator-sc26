# Dependabot: woechentliche Pull Requests fuer die gepinnten Basis-Images im Dockerfile (neue Digests bringen
# Debian- und CPython-Sicherheitskorrekturen) und fuer die Actions der CI. Die Python-Pakete bleiben beim Lockfile
# (uv 0.7.13 in CI und Image); bekannte Schwachstellen meldet pip-audit in jeder Pipeline.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Neue Digests desselben Tags ja, aber kein Python 3.14: requires-python erlaubt nur 3.13 (uv.lock)
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # uv bleibt bei der Version von CI und Lockfile (0.7.13); ein Wechsel gilt fuer alle drei zugleich
      - dependency-name: "*astral-sh/uv"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
