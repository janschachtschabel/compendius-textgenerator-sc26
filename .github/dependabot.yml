# Dependabot: Pull Requests fuer die gepinnten Basis-Images im Dockerfile (neue Digests bringen Debian- und
# CPython-Sicherheitskorrekturen), fuer Prometheus in docker-compose.yml, fuer die per Commit gepinnten Actions der
# CI und fuer die Python-Pakete im Lockfile. Je Oekosystem und Termin ein einziger Pull Request (groups), damit
# nichts liegen bleibt. Bekannte Schwachstellen meldet pip-audit bei jedem Push und woechentlich
# (dependency-audit.yml).
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Neue Digests desselben Tags ja, aber kein Python 3.14: requires-python erlaubt nur 3.13 (uv.lock)
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # uv: eine neue Minor-Version im Monatsrhythmus ihrer Releases, keine Patch-Flut und kein Major. Der Pull
      # Request hebt nur das Dockerfile; tests/test_ci_pins.py bleibt rot, bis dieselbe Version auch in ci.yml
      # (zweimal), dependency-audit.yml und .gitlab-ci.yml (Tag und Digest) steht (Audit 2026-09-28, AB-06)
      - dependency-name: "*astral-sh/uv"
        update-types: ["version-update:semver-major", "version-update:semver-patch"]
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Dependabot schreibt das Lockfile in Revision 3, wie uv 0.12.19 in CI und Image (am 2026-09-28 geprueft: lock
  # --check gelingt). Monatlich, weil jede Aenderung die ganze Suite durchlaufen muss.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    groups:
      python-packages:
        patterns: ["*"]
