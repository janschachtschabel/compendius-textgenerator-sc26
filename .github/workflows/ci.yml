# Checks for every push to main and every pull request: the same commands as the GitLab pipeline.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.7.13"
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-extras
      - name: Lint and format
        run: |
          uv run ruff check app tests scripts
          uv run ruff format --check app tests scripts
      - name: Types
        run: uv run mypy app
      - name: Tests with coverage gate
        # Set on purpose: tests/conftest.py must keep shell configuration away from the tests (test_isolation.py)
        env:
          LLM_ENABLED: "true"
          B_API_KEY: ci-dummy-not-a-key
          POLICY_CONFIDENT_SCORE: "0.1"
        run: uv run pytest -m "not live" --cov
      - name: Prometheus configuration and alert rules
        run: |
          docker run --rm -v "$PWD/monitoring:/m:ro" --entrypoint promtool prom/prometheus:v3.14.0 check config /m/prometheus.yml
          docker run --rm -v "$PWD/monitoring:/m:ro" --entrypoint promtool prom/prometheus:v3.14.0 test rules /m/alerts_test.yml
      - name: Image builds (without the embedding model, to stay fast)
        run: docker build --build-arg MODEL2VEC_ID= -t compendious-text-fastapi:ci .
      - name: Known vulnerabilities in the runtime dependencies
        run: |
          uv export --frozen --no-dev --all-extras --no-emit-project --format requirements-txt -o requirements.txt
          uvx pip-audit --requirement requirements.txt --disable-pip --no-deps
