# Known vulnerabilities in the locked runtime packages, once a week. ci.yml runs the same check on every push; an
# advisory published between two pushes would otherwise go unnoticed until the next one (audit 2026-09-27, AB-01).
name: Dependency audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: "3.13"
      - name: Known vulnerabilities in the runtime dependencies
        run: |
          uv export --frozen --no-dev --all-extras --no-emit-project --format requirements-txt -o requirements.txt
          uvx pip-audit==2.10.1 --requirement requirements.txt --disable-pip --no-deps
