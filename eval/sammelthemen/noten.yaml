# Noten für M37 (docs/entwicklung/messung/mc_sammelthemen.py): Gehört ein Wikipedia-Artikel, aus dem ein Kompendium
# zu einem Sammel- oder Mischthema ("deutsche Dichter", "Klimawandel und Landwirtschaft") Absätze gedruckt hat, zum
# Thema? Je Thema jeder Artikel einmal, den mindestens einer der vier Wege (R, B, A, N) gedruckt hat: 289 Paare aus
# 25 Themen. Benotet am 26.09.2026 von einem Claude-Subagenten,
# aus Thema, Titel und den ersten 400 Zeichen der Einleitung, blind: ohne zu wissen, welcher Weg den Artikel gedruckt
# hat, die Artikel je Thema gemischt (Saat 37).
# 2: gehört zum Thema - das Thema selbst, sein Übersichtsartikel oder ein zentraler Teil, Vertreter oder Aspekt.
# 1: verwandt - Hintergrund, Nachbarthema, nur eine Hälfte eines verbundenen Themas, das weitere Fachgebiet.
# 0: unpassend - andere Bedeutung, fremdes Thema, Zufallstreffer.
# Die Artikeltexte stehen nicht hier: Die Messung liest sie aus dem Archiv.
