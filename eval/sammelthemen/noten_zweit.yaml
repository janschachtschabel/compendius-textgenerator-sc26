# Noten für M37 (docs/entwicklung/messung/mc_sammelthemen.py): Gehört ein Wikipedia-Artikel, aus dem ein Kompendium
# zu einem Sammel- oder Mischthema ("deutsche Dichter", "Klimawandel und Landwirtschaft") Absätze gedruckt hat, zum
# Thema? Je Thema jeder Artikel einmal, den mindestens einer der vier Wege (R, B, A, N) gedruckt hat: 289 Paare aus
# 25 Themen. Benotet am 26.09.2026 von einem zweiten Claude-Subagenten, der rückwärts las,
# aus Thema, Titel und den ersten 400 Zeichen der Einleitung, blind: ohne zu wissen, welcher Weg den Artikel gedruckt
# hat, die Artikel je Thema gemischt (Saat 37).
# 2: gehört zum Thema - das Thema selbst, sein Übersichtsartikel oder ein zentraler Teil, Vertreter oder Aspekt.
# 1: verwandt - Hintergrund, Nachbarthema, nur eine Hälfte eines verbundenen Themas, das weitere Fachgebiet.
# 0: unpassend - andere Bedeutung, fremdes Thema, Zufallstreffer.
# Die Artikeltexte stehen nicht hier: Die Messung liest sie aus dem Archiv.
# Dazu seit M38 (docs/entwicklung/messung/mc_sammelthemen_ohne_llm.py): 122 Paare, die erst die Wege ohne
# großes LLM druckten (P: Parse und Archiv; L8, Q30: die Frage N an kleine Modelle), benotet am 26.09.2026 von
# einem weiteren Claude-Subagenten, der rückwärts las, ebenso blind, mit derselben Skala, je Thema gemischt (Saat 38).
# Dazu seit M40 (docs/entwicklung/messung/mc_sammelthemen_lokal.py): 27 Paare, die erst die Frage N an kleine
# lokale Modelle druckte (LFM2-700M, LFM2.5-1.2B, Qwen3-0.6B über llama.cpp), benotet am 27.09.2026 von einem
# weiteren Claude-Subagenten, ebenso blind, mit derselben Skala, je Thema gemischt (Saat 40).
# Dazu seit M54 (docs/entwicklung/messung/mc_genannte_teile.py, Audit A02): 72 Paare, die die Frage N am 03.10.2026
# nannte und die noch keine Note hatten, benotet von einem zweiten weiteren Claude-Subagenten, ebenso blind, mit derselben Skala, je Thema gemischt (Saat 41).
