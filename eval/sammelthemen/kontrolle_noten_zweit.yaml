# Noten für die Kontrolle von M37 (docs/entwicklung/messung/mc_sammelthemen.py --normal): Gehört ein Wikipedia-Artikel,
# aus dem ein Kompendium zu einem der 20 gewöhnlichen Themen von M1 (eval/artikelwahl/korpus_labels.yaml) Absätze
# gedruckt hat, zum Thema? Je Thema jeder Artikel einmal, den mindestens einer der vier Wege (R, B, A, N) gedruckt hat:
# 233 Paare. Benotet am 26.09.2026 von einem zweiten Claude-Subagenten, der rückwärts las,
# aus Thema, Titel und den ersten 400 Zeichen der Einleitung, blind: ohne zu wissen, welcher Weg den Artikel gedruckt
# hat, die Artikel je Thema gemischt (Saat 371).
# 2: gehört zum Thema - das Thema selbst, sein Übersichtsartikel oder ein zentraler Teil, Kernbegriff oder Vorgang.
# 1: verwandt - Hintergrund, Nachbarthema, das weitere Fachgebiet oder ein direkter Oberbegriff, ein einzelnes Beispiel.
# 0: unpassend - andere Bedeutung, fremdes Thema, Zufallstreffer.
# Die Artikeltexte stehen nicht hier: Die Messung liest sie aus dem Archiv.
