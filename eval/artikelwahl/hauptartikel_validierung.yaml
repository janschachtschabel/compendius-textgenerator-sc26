# Zweites Gold für die Themenauflösung: neue Anfragen, mit denen die Verbesserungen der Artikelwahl geprüft werden.
#
# Festgelegt von Claude am 2026-09-23, bevor die Verbesserungen geschrieben wurden und bevor der Dienst diese Anfragen
# aufgelöst hat; redaktionell ungeprüft. Aufbau und Regeln wie in hauptartikel.yaml. Die erste Regelrunde entstand
# ohne diese Anfragen und fand hier 21 statt 14 von 23. Ihre zwei übrigen Fehler („Deutsch: Fall“, „Ursachen der
# Französischen Revolution“) flossen in die zweite Runde ein; seitdem ist dieser Satz nicht mehr unabhängig.
#
# Korrektur vor dem ersten Lauf: Einen Artikel „Satz (Musik)“ gibt es nicht; die Begriffsklärung nennt drei
# musikalische Bedeutungen, alle drei zählen (mehrere Artikel können passen).

