# Relevanz der Korpusartikel für ein Schulkompendium zum Thema (Messung M8, docs/entwicklung/05-messprotokoll.md)
#
# Vergeben von Claude am 2026-09-23, blind: je Thema alle Artikel, die der neue Dienst in seinen Korpus holt, und
# alle Artikel, die der alte Dienst im besten Fall abrief, gemischt, alphabetisch, nur mit Titel und Artikelanfang,
# ohne Angabe, welcher Dienst den Artikel gewählt hat (Klexikon-Artikel verraten ihre Herkunft). Redaktionell
# ungeprüft; ein LLM-Richter hat dieselben Artikel als Gegenprobe bewertet.
#
# Skala:
#   2 gehört zum Thema: das Thema selbst, ein Teilgebiet, ein Kernbegriff, ein zentraler Vorgang, ein zentrales
#     Ereignis oder eine Person, deren Bedeutung im Thema liegt
#   1 verwandt: Nachbarthema, direkter Oberbegriff, Hintergrund, einzelnes Werk als Beispiel, Person mit breiterem
#     Wirken, allgemeiner Artikel zu einem beteiligten Stoff
#   0 passt nicht: andere Bedeutung, Begriffsklärung, Liste, Film gleichen Namens, weit entfernter Oberbegriff
#     (Physik, System, Theorie) oder kein erkennbarer Bezug

