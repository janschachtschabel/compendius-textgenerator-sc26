# Gold für die Themenauflösung: welcher Wikipedia-Artikel ist der richtige Hauptartikel einer Anfrage?
#
# Festgelegt von Claude am 2026-09-23, bevor der Dienst diese Anfragen aufgelöst hat; redaktionell ungeprüft.
# "erwartet" nennt die akzeptierten Titel. Eine Weiterleitung, die Wikipedia selbst für einen dieser Titel setzt,
# zählt mit (die Auswertung liest jeden erwarteten Titel im Archiv und nimmt das Ziel dazu). Bei Anfragen ohne
# Kontext, die mehrere Bedeutungen haben, gilt die im Schulunterricht übliche.
#
# Korrektur vor dem ersten Lauf: Einen Artikel „Welle (Physik)“ gibt es im Archiv nicht; der Artikel „Welle“ ist
# der physikalische, die Bedeutungen stehen unter „Welle (Begriffsklärung)“. Beide Welle-Anfragen erwarten „Welle“.
#
# Arten:
#   normal                  - die 20 Themen der Laufzeitmessung M1, so wie Lehrkräfte sie eingeben
#   zusatz                  - Klassen-, Stufen- und Fachzusätze, die vor der Auflösung abgetrennt werden
#   mehrdeutig_mit_fach     - mehrdeutiges Wort mit vorangestelltem Fach als Kontext
#   mehrdeutig_ohne_kontext - mehrdeutiges Wort ohne jeden Kontext
#   variante                - andere Schreibung, Abkürzung, Mehrzahl, Kleinschreibung
#   ohne_eigenen_artikel    - Anfragen, zu denen es keinen gleichnamigen Artikel gibt

