# Drittes Gold für die Themenauflösung: zurückgehaltener Test.
#
# Festgelegt von Claude am 2026-09-23, bevor die Verbesserungen der Artikelwahl geschrieben wurden. Diese Anfragen
# liefen erst, als die Regeln feststanden: 8 von 12 richtig (alter Stand 7), mit article_choice=llm 9. Dabei zeigten
# sich zwei Fehler, die danach behoben wurden - Wortformen eines Fachworts zählten doppelt („Mathematik: Ableitung“),
# und ein exakter Titel ohne jeden Fachbezug galt als sicher („Erdkunde: Delta“); seitdem 9, mit LLM 11, und der Satz
# ist nicht mehr unabhängig. Redaktionell ungeprüft. Aufbau und Regeln wie in hauptartikel.yaml.

