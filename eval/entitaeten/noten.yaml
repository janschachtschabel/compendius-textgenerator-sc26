# Noten für M36 (docs/entwicklung/messung/mc_entitaeten.py): Soll /api/v2/entities für den Text eines Materials
# (Titel, Beschreibung und Schlagwörter der 40 Materialien aus eval/materialwahl/materialien.yaml) diesen
# Wikipedia-Artikel liefern? Je Material jeder Artikel einmal, den mindestens ein Weg verknüpft hat (ner, dictionary,
# LLM nennt): 654 Paare. Benotet am 26.09.2026 von einem Claude-Subagenten,
# aus dem Text des Materials, dem Titel und den ersten 400 Zeichen der Einleitung, blind: ohne zu wissen, welcher Weg
# den Artikel fand, je Material gemischt (Saat 36).
# 2: eine Person, ein Ort, eine Organisation, ein Werk, ein Ereignis oder ein Fachbegriff, um den es im Text geht,
#    und der Artikel meint genau das.
# 1: der Artikel meint ein Wort des Textes richtig, aber es ist nebensächlich oder ein Allerweltswort, oder er ist
#    nur das weitere Fachgebiet.
# 0: der Artikel meint etwas anderes als der Text (andere Bedeutung, Namensvetter) oder hat nichts mit ihm zu tun.
# Die Texte stehen nicht hier: Die Messung liest sie aus dem Repository und dem Archiv.
