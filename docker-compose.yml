# Lokaler Betrieb und Vorlage fuer das Deployment (PLAN.md 10): API plus Updater-Sidecar.
# Das Image kommt aus der GitHub Container Registry; IMAGE ueberschreibt es, build: . baut es lokal.
# Eine .env wird gelesen, wenn sie da ist; fehlt sie, gelten die Vorgaben aus app/settings.py.
# Das Volume "zim" ist fuer 40 GB geplant (Entscheidung D18). Docker begrenzt Volumes nicht;
# in Kubernetes entspricht das einem PersistentVolumeClaim mit 40Gi.
services:
  api:
    image: ${IMAGE:-ghcr.io/janschachtschabel/compendius-textgenerator-sc26:latest}
    build: .
    env_file:
      # Lange Schreibweise mit Absicht: ohne required: false bricht Compose ab, wenn keine .env da
      # ist - und beim Import aus einer URL ist genau das der Normalfall. Braucht Compose 2.24+.
      - path: .env
        required: false
    environment:
      ZIM_DIR: /data/zim
      STATE_DIR: /data/state
    volumes:
      - zim:/data/zim
      - state:/data/state
    ports:
      # Standard: nur lokal erreichbar. Ein Host, der den Dienst selbst veroeffentlicht, setzt
      # API_BIND=0.0.0.0:8000 - dann gehoert ein Reverse-Proxy davor (Rate-Limit: FORWARDED_ALLOW_IPS)
      - "${API_BIND:-127.0.0.1:8000}:8000"
    restart: unless-stopped

  zim-updater:
    image: ${IMAGE:-ghcr.io/janschachtschabel/compendius-textgenerator-sc26:latest}
    build: .
    command: ["compendium", "zim", "sync", "--loop"]
    # Kein HTTP-Server: der Healthcheck des Images (GET /health) gilt nur fuer die API
    healthcheck:
      disable: true
    env_file:
      - path: .env
        required: false
    environment:
      ZIM_DIR: /data/zim
      # Erststart: fehlende Pflichtarchive des Profils laden (Profil standard: ca. 14,1 GB)
      ZIM_BOOTSTRAP_DOWNLOAD: ${ZIM_BOOTSTRAP_DOWNLOAD:-true}
    volumes:
      - zim:/data/zim
    restart: unless-stopped

  lehrplan-updater:
    image: ${IMAGE:-ghcr.io/janschachtschabel/compendius-textgenerator-sc26:latest}
    build: .
    # Woechentliche Zaehlpruefung gegen MEM, Vollabzug bei Aenderung oder Alter (PLAN.md 5.2, D16)
    command: ["compendium", "lehrplan", "harvest", "--loop"]
    healthcheck:
      disable: true
    env_file:
      - path: .env
        required: false
    environment:
      STATE_DIR: /data/state
    volumes:
      - state:/data/state
    restart: unless-stopped

  # Ueberwachung (PLAN.md D31): docker compose --profile monitoring up -d api prometheus
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring:/etc/prometheus:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

volumes:
  zim:
  state:
  prometheus:
