# Lokaler Betrieb und Vorlage fuer das Deployment (PLAN.md 10): die API und vier Updater-Sidecars.
# Das Image kommt aus der GitHub Container Registry; IMAGE ueberschreibt es, build: . baut es lokal.
# Eine .env wird gelesen, wenn sie da ist; fehlt sie, gelten die Vorgaben aus app/settings.py. Eine Anfrage ohne
# preset laeuft mit PRESET_DEFAULT (best-quality-generated), solange ein LLM eingerichtet ist, sonst mit llm-free (D68). Was
# ein Update am Betrieb aendert, steht in docs/betrieb.md unter "Updates".
# Das Volume "zim" ist fuer 40 GB geplant (Entscheidung D18). Docker begrenzt Volumes nicht;
# in Kubernetes entspricht das einem PersistentVolumeClaim mit 40Gi.

# Jeder Dienst begrenzt sein Protokoll: ohne max-size waechst die Datei, bis die Platte voll ist (Audit
# 2026-09-27, BE-06).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Code und Modelle gehoeren im Image root (Dockerfile); kein Dienst hat Linux-Capabilities oder bekommt neue Rechte
# (Audit 2026-09-27, SE-12). Nur lesbar ist das Dateisystem der API, die von aussen erreichbar ist: Die Index-
# Sidecars bauen mit SQLite und schreiben dessen Sortier-Dateien nach /var/tmp; mit read_only laegen sie im tmpfs
# /tmp, also im Arbeitsspeicher des Hosts, beim Wikidata-Index Hunderte MB.
x-hardening: &hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# Die Sidecars brauchen keines der Geheimnisse aus der .env; environment geht env_file vor (Audit 2026-09-27,
# SE-11).
x-no-secrets: &no-secrets
  B_API_KEY: ""
  EDU_SHARING_USER: ""
  EDU_SHARING_PASSWORD: ""
  ADMIN_TOKEN: ""
  METRICS_TOKEN: ""
  API_KEYS: ""

services:
  api:
    image: ${IMAGE:-ghcr.io/janschachtschabel/compendius-textgenerator-sc26:latest}
    build: .
    <<: *hardening
    # Schreiben nur in die Volumes und nach /tmp (Metrik-Dateien der Worker)
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      # Lange Schreibweise mit Absicht: ohne required: false bricht Compose ab, wenn keine .env da
      # ist - und beim Import aus einer URL ist genau das der Normalfall. Braucht Compose 2.24+.
      - path: .env
        required: false
    environment:
      ZIM_DIR: /data/zim
      STATE_DIR: /data/state
    volumes:
      - zim:/data/zim
      - state:/data/state
    ports:
      # An alle Schnittstellen, damit der Port auch in einer Hosting-Umgebung erreichbar ist: deren
      # Proxy laeuft in der Regel nicht im selben Netz-Namensraum und kaeme an eine Loopback-Bindung
      # nicht heran. API_BIND=127.0.0.1:8000 holt die alte, nur lokale Bindung zurueck - auf einem
      # Arbeitsrechner ist das die richtige Wahl. Die Firewall des Hosts (ufw) schuetzt einen
      # veroeffentlichten Port nicht: Docker leitet an ihr vorbei. Oeffentlich also API_KEYS und
      # METRICS_TOKEN setzen (docs/installation.md, Abschnitt 8); ein Reverse-Proxy auf dem Host
      # braucht API_BIND=127.0.0.1:8000 und FORWARDED_ALLOW_IPS auf das Gateway des Compose-Netzes.
      - "${API_BIND:-0.0.0.0:8000}:8000"
    # Ein Update beendet die API mit SIGTERM; uvicorn laesst laufende Anfragen bis REQUEST_TIMEOUT_S plus 15 s zu
    # Ende laufen (app/serve.py), Docker toetete sie sonst nach 10 s. Wer REQUEST_TIMEOUT_S hebt, setzt
    # API_STOP_GRACE_PERIOD ueber REQUEST_TIMEOUT_S plus 15 s: Das Panel uebernimmt diese Datei bei jedem Update
    # (Audit 2026-09-28, BE-17).
    stop_grace_period: ${API_STOP_GRACE_PERIOD:-150s}
    # Gemessen am 29.09.2026 2,5 GiB nach dem Start und 3,4 GiB nach dem Aufwaermen, rund 1,7 GiB je Worker
    # (docs/uebergabe/README.md). Die alte Grenze 4 GiB trug die zwei Worker des Images knapp, den Rest fuellte der
    # Seiten-Cache; 6 GiB lassen Luft fuer Spitzen. Mit mehr Workern API_MEMORY heben, je Worker rund 1,7 GiB.
    mem_limit: ${API_MEMORY:-6g}
    logging: *logging
    restart: unless-stopped

  zim-updater:
    image: ${IMAGE:-ghcr.io/janschachtschabel/compendius-textgenerator-sc26:latest}
    build: .
    <<: *hardening
    command: ["compendium", "zim", "sync", "--loop"]
    # Kein HTTP-Server: der Healthcheck des Images (GET /health) gilt nur fuer die API
    healthcheck:
      disable: true
    env_file:
      - path: .env
        required: false
    environment:
      <<: *no-secrets
      ZIM_DIR: /data/zim
      # Erststart: fehlende Pflichtarchive des Profils laden (Profil standard: ca. 14,1 GB)
      ZIM_BOOTSTRAP_DOWNLOAD: ${ZIM_BOOTSTRAP_DOWNLOAD:-true}
    volumes:
      - zim:/data/zim
    logging: *logging
    restart: unless-stopped

  lehrplan-updater:
    image: ${IMAGE:-ghcr.io/janschachtschabel/compendius-textgenerator-sc26:latest}
    build: .
    <<: *hardening
    # Woechentliche Zaehlpruefung gegen MEM, Vollabzug bei Aenderung oder Alter (PLAN.md 5.2, D16)
    command: ["compendium", "lehrplan", "harvest", "--loop"]
    healthcheck:
      disable: true
    env_file:
      - path: .env
        required: false
    environment:
      <<: *no-secrets
      STATE_DIR: /data/state
    volumes:
      - state:/data/state
    logging: *logging
    restart: unless-stopped

  wikidata-updater:
    image: ${IMAGE:-ghcr.io/janschachtschabel/compendius-textgenerator-sc26:latest}
    build: .
    <<: *hardening
    # Wikidata-Index fuer /entities (D43, D64, D65): baut ihn beim Erststart aus drei Dumps der deutschen Wikipedia
    # (rund 750 MB, danach geloescht) und neu, wenn ein neueres Wikipedia-Archiv einen neueren Dump braucht.
    # Liest das ZIM-Volume nur, um das Datum des aktiven Archivs zu kennen.
    command: ["compendium", "wikidata", "sync", "--loop"]
    healthcheck:
      disable: true
    env_file:
      - path: .env
        required: false
    environment:
      <<: *no-secrets
      ZIM_DIR: /data/zim
      STATE_DIR: /data/state
    volumes:
      - zim:/data/zim:ro
      - state:/data/state
    logging: *logging
    restart: unless-stopped

  gnd-updater:
    image: ${IMAGE:-ghcr.io/janschachtschabel/compendius-textgenerator-sc26:latest}
    build: .
    <<: *hardening
    # GND-Index fuer /entities (D65): baut ihn beim Erststart aus den Abzuegen der DNB (Sachbegriffe und Geografika,
    # rund 65 MB, danach geloescht) und neu, wenn die DNB eine neuere Ausgabe veroeffentlicht.
    command: ["compendium", "gnd", "sync", "--loop"]
    healthcheck:
      disable: true
    env_file:
      - path: .env
        required: false
    environment:
      <<: *no-secrets
      STATE_DIR: /data/state
    volumes:
      - state:/data/state
    logging: *logging
    restart: unless-stopped

  # Ueberwachung (PLAN.md D31): docker compose --profile monitoring up -d api prometheus
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: ["monitoring"]
    # Das Image laeuft als nobody und schreibt nur in sein Volume; Capabilities braucht es nicht (Audit 2026-09-29, O5)
    <<: *hardening
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring:/etc/prometheus:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    logging: *logging
    restart: unless-stopped

volumes:
  zim:
  state:
  prometheus:
