# Beispiel-Values für ein Helm-Chart des Kompendium-Dienstes (Vorlage, kein fertiges Chart).
# Jeder Schlüssel unter env wird zur Umgebungsvariable gleichen Namens; Vorgaben und Bedeutung: konfiguration.md.
# Referenz für Container, Volumes und Härtung: docker-compose.yml. Betrieb hinter dem Proxy der b-api (Variante A).

image:
  repository: ghcr.io/janschachtschabel/compendius-textgenerator-sc26
  tag: "2.23.0"            # beide Ports ab 2.22.0 (D110, D111); in Produktion nie latest

# Für alle Container, wie in Compose die gemeinsame .env
env:
  LOG_FORMAT: json
  LOG_LEVEL: INFO
  ZIM_PROFILE: standard

securityContext:            # wie docker-compose.yml: kein root, nur lesendes Wurzeldateisystem, keine Capabilities
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001            # PVCs übernehmen das chown des Images nicht: ohne fsGroup schreiben die Sidecars nicht
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
  allowPrivilegeEscalation: false
tmpEmptyDir:                # die API schreibt dorthin Metrikdateien, ihre Log-Konfiguration (app/serve.py) und mit
  mountPath: /tmp           # WLO_CACHE_PATH den Repository-Cache des Pods
  sizeLimit: 1Gi

api:
  replicas: 1              # mehr Pods: zim und state als ReadWriteMany, Sidecars je genau einmal (anforderungen.md, 5.1)
  port: 8000               # die API, über den Ingress (PUBLIC_PORT, D111)
  internalPort: 9000       # Proben, /metrics, Stand (INTERNAL_PORT, D110); kein Ingress, nur im Cluster
  resources:               # gemessen 16.10.2026 mit zwei Workern, mit Reserve (README.md, Ressourcen)
    requests: { cpu: "2", memory: 5Gi }
    limits: { cpu: "4", memory: 6Gi }
  probes:                  # am internen Port des Pods; am Port 8000 antworten die Pfade mit 404
    liveness: { port: 9000, path: /health, periodSeconds: 30, timeoutSeconds: 5 }
    readiness: { port: 9000, path: /ready, periodSeconds: 30, timeoutSeconds: 5 }
    startup: { port: 9000, path: /health, failureThreshold: 20, periodSeconds: 30 }   # Start gemessen 22 bis 31 s
  terminationGracePeriodSeconds: 630   # laufende Anfragen enden, bevor der Pod geht (API_STOP_GRACE_PERIOD)
  env:
    WEB_CONCURRENCY: "2"
    PUBLIC_PORT: "8000"           # wie api.port
    INTERNAL_PORT: "9000"      # wie api.internalPort; 0 legt alles auf PUBLIC_PORT
    LLM_ENABLED: "true"
    B_API_KEY_SOURCE: request    # Schlüssel des Aufrufers, den die b-api weiterreicht (D105)
    B_API_PROVIDER: openai       # ohne Routing; router erst mit einer globalen Route der b-api
    B_API_MODEL: gpt-6-luna
    RATE_LIMIT: "0"              # die b-api begrenzt je Schlüssel (D104)
    UI_ENABLED: "false"
    WLO_CACHE_PATH: /tmp/wlo_cache.db   # je Pod im emptyDir /tmp: kein SQLite-Schreiben über ein geteiltes Volume
    API_DOCS_ENABLED: "true"     # /openapi.json für die b-api und den Produktkatalog
    EDU_SHARING_BASE_URL: https://redaktion.openeduhub.net/edu-sharing/rest
  secretEnv:                     # aus einem Secret, nie in den Values
    B_API_KEY: ""                # optional bei B_API_KEY_SOURCE=request: nur für Anfragen ohne eigenen Schlüssel
    API_KEYS: ""                 # hinter dem Proxy der b-api leer lassen
    ADMIN_TOKEN: ""              # mindestens 16 Zeichen; leer schaltet die Admin-Pfade ab
    METRICS_TOKEN: ""            # für /metrics
    EDU_SHARING_USER: ""         # nur, wenn der Dienst allein über die b-api erreichbar ist (konfiguration.md)
    EDU_SHARING_PASSWORD: ""

# Die Sidecars nutzen dasselbe Image mit eigenem Befehl, ohne Secrets; jeder läuft genau einmal. Ressourcen: im
# Leerlauf je rund 108 MiB gemessen, beim Bau der Indexe nicht; die Grenzen sind geschätzt (anforderungen.md, 5.3).
sidecarResources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }
sidecars:
  zimUpdater:
    enabled: true
    command: [compendium, zim, sync, --loop]
    env: { ZIM_BOOTSTRAP_DOWNLOAD: "true" }
    volumes: [zim]
  lehrplanUpdater:
    enabled: true
    command: [compendium, lehrplan, harvest, --loop]
    volumes: [state]
  wikidataUpdater:
    enabled: true
    command: [compendium, wikidata, sync, --loop]
    volumes: [zim, state]        # zim nur lesend
    resources:                   # baut den Index aus rund 750 MB Dumps
      limits: { cpu: "1", memory: 1536Mi }
  gndUpdater:
    enabled: true
    command: [compendium, gnd, sync, --loop]
    volumes: [state]

volumes:
  zim:
    size: 60Gi             # Archive rund 18,7 GB, beim Wechsel der Wikipedia bis rund 38 GB
    accessMode: ReadWriteMany
    mountPath: /data/zim
  state:
    size: 5Gi              # 0,45 GB, dazu rund 1,5 GB frei für den Neubau des Wikidata-Index
    accessMode: ReadWriteMany
    mountPath: /data/state

ingress:
  # Variante A: nur der Proxy der b-api darf den Dienst erreichen (internes Ingress oder NetworkPolicy), denn
  # API_KEYS ist leer und der Dienst prüft den Schlüssel nicht selbst. Freigegeben nur die öffentlichen Pfade
  # (betrieb.md, Erreichbarkeit); intern bleiben Proben, /metrics, die Statusendpunkte und alle Admin-Pfade.
  paths:
    - { path: /api/v2/compendium, methods: [POST] }
    - { path: /api/v2/knowledge, methods: [POST] }
    - { path: /api/v2/entities, methods: [POST] }
    - { path: /api/v2/qa, methods: [POST] }
    - { path: /api/v2/nodes/, methods: [GET] }
    - { path: /api/v2/collections/, methods: [GET] }      # nur .../overview
    - { path: /api/v2/lehrplan/search, methods: [GET] }
    - { path: /api/v2/matching/strategies, methods: [GET] }
    - { path: /api/v2/templates, methods: [GET] }          # lesen; PUT und DELETE sind Admin
    - { path: /openapi.json, methods: [GET] }
    - { path: /docs, methods: [GET] }
    - { path: /redoc, methods: [GET] }
  timeoutSeconds: 330      # REQUEST_TIMEOUT_S 300 plus Puffer

networkPolicy:
  # Variante A: Port 8000 nur für den Proxy der b-api, Port 9000 nur für Kubelet (Proben) und Prometheus. Die Selektoren
  # hängen vom Cluster ab und sind hier Platzhalter.
  enabled: true
  publicFrom: [{ namespaceSelector: { matchLabels: { name: b-api } } }]
  internalFrom: [{ namespaceSelector: { matchLabels: { name: monitoring } } }]
  egress: open             # ausgehend: b-api, edu-sharing, Kiwix, Wikimedia, DNB, MEM (README.md, Netz)

monitoring:
  prometheusRule:
    enabled: true          # monitoring/alerts.yml: groups unter spec
  serviceMonitor:
    enabled: true
    port: 9000             # der interne Port; am Port 8000 antwortet /metrics mit 404
    path: /metrics
    jobLabel: kompendium   # die Regeln fragen job="kompendium" (KompendiumDown: up{job="kompendium"} == 0)
    bearerTokenSecret: METRICS_TOKEN
