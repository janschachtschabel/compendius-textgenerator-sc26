<text x="24.0" y="312.0" font-size="11.5" fill="#52606d" text-anchor="start" font-weight="normal">NetworkPolicy im Chart: ein zu 8000 nur von der b-api, zu 9000 nur vom Monitoring; aus nur DNS und die genannten Ziele.</text>
