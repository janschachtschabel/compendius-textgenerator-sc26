<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Zwei Ports: öffentliche API und interne Proben und Metriken, mit NetworkPolicy"><title>Zwei Ports: öffentliche API und interne Proben und Metriken, mit NetworkPolicy</title><rect width="880" height="340" fill="#ffffff"/>
<text x="24.0" y="32.0" font-size="17" fill="#1f2933" text-anchor="start" font-weight="700">Zwei Ports und eine NetworkPolicy</text>
<text x="24.0" y="52.0" font-size="12" fill="#52606d" text-anchor="start" font-weight="normal">Öffentlich nur die API; Proben und Metriken nur im Cluster; ausgehend nur, was der Dienst braucht</text>
