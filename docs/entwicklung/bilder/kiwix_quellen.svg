<text x="24.0" y="772.0" font-size="10.5" fill="#52606d" text-anchor="start" font-weight="normal">Volltextsuche: was eine Suche über das Archiv brächte; M11 maß sie für Wikibooks und Wikiversity, sie kam nicht.</text>
<text x="24.0" y="788.0" font-size="10.5" fill="#52606d" text-anchor="start" font-weight="normal">Gedruckt: Teil 1 mit den Regeln (hybrid_light, 30.000 Zeichen); ohne Zusatz 458 Absätze, 117 Bausteine.</text>
<text x="24.0" y="804.0" font-size="10.5" fill="#52606d" text-anchor="start" font-weight="normal">Farbe nach der Seite, aus der ein Absatz stammt. Einordnung: Claude, ein Gutachter, ungeprüft (m84_einordnung.yaml).</text>
<text x="24.0" y="820.0" font-size="10.5" fill="#52606d" text-anchor="start" font-weight="normal">Gutenberg (11 GB) nicht gemessen: kein Volltextindex, ganze Bücher statt Artikel.</text></svg>
