<text x="24.0" y="412.0" font-size="10.5" fill="#52606d" text-anchor="start" font-weight="normal">Jeder Absatz, den llm-free oder balanced bei einem Faktor drucken, blind benotet von zwei Claude-Gutachtern (Mittel); Summe der vier Themen.</text>
<text x="24.0" y="428.0" font-size="10.5" fill="#52606d" text-anchor="start" font-weight="normal">Über dem Balken: alle Absätze und ihr Anteil daneben. Darunter: die neuen Absätze gegenüber dem nächstkleineren Faktor und ihr Anteil daneben.</text>
<text x="24.0" y="444.0" font-size="10.5" fill="#52606d" text-anchor="start" font-weight="normal">Was ×1 druckt, drucken alle größeren Faktoren auch (gleicher Korpus je Thema).</text></svg>
