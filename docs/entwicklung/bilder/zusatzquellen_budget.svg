<text x="24.0" y="446.0" font-size="10.5" fill="#52606d" text-anchor="start" font-weight="normal">Gewonnen: Absätze aus Wikibooks und Wikiversity im Text. Verdrängt: Absätze der Wikipedia, gedruckt ohne die</text>
