<text x="24.0" y="484.0" font-size="10.5" fill="#52606d" text-anchor="start" font-weight="normal">Kompendium mit Teil 1 und 2, Median je Anfrage. M75, M78 und M82: die neun Themen von M52 im Einmal-Container, gpt-6-luna über OpenAI direkt.</text>
<text x="24.0" y="500.0" font-size="10.5" fill="#52606d" text-anchor="start" font-weight="normal">M45: der laufende Entwicklungscontainer über HTTP, das LLM über die b-api, je LLM-Profil sechs eigene Themen, llm-free 18; best-coverage-generated kam mit D69.</text>
<text x="24.0" y="516.0" font-size="10.5" fill="#52606d" text-anchor="start" font-weight="normal">Zwischen M45 und M75: 30.000 statt 12.000 Zielzeichen (D70), best-quality-generated schreibt leere Bausteine aus Modellwissen (D72),</text>
<text x="24.0" y="532.0" font-size="10.5" fill="#52606d" text-anchor="start" font-weight="normal">N, Artikelwahl und Lehrplanprüfung fragen ohne Denken (D81). Zwischen M75 und M78: D93, Teil 2 und 3 neben Teil 1, die Zuordnung in Zeilen,</text>
<text x="24.0" y="548.0" font-size="10.5" fill="#52606d" text-anchor="start" font-weight="normal">20 gleichzeitige Aufrufe. M78 lief am Nachmittag, M82 nachts.</text></svg>
