# M84: Einordnung der Seiten aus Klexikon und den weiteren Kiwix-Archiven (mc_kiwix_quellen.py)
#
# Festgelegt von Claude am 2026-10-09 nach Titel, Gliederung und Anfang jeder Seite (der Anfang liegt im Pool des
# Skripts, außerhalb des Repositorys); ein Gutachter, redaktionell ungeprüft. Bezug ist immer das angefragte Thema.
#
#   passend   - erklärt das Thema oder einen klaren Teil davon als heutiger deutscher Sachtext; bei einem Sammelthema
#               ein Glied der Sammlung (Beethoven zu „Komponisten der Klassik“) oder ihr Oberbegriff
#   teilweise - zum Thema, aber in einer Form, die ein Kompendium nicht als Text übernehmen kann: Wörterbucheintrag,
#               Zitatliste, historischer Text (19. Jahrhundert bis 1949), Linkliste, Reiseführer, Unterrichtsplanung,
#               Kursprotokoll, Quiz, Leseliste, Gesetzestext; oder nur am Rand des Themas, oder mehrere Bedeutungen
#               eines Wortes auf einer Seite
#   daneben   - anderes Thema, andere Sprache (Ungarisch-Lesebuch), Druck- oder LaTeX-Fassung eines Buchs, leere Seite
#
# gleicher_titel: je erwartetem Hauptartikel des Golds (eval/artikelwahl/hauptartikel.yaml) die Seite gleichen Titels.
# volltextsuche: je Sammel- und Aspektthema von M82 die Treffer, die die Themenprüfung des Dienstes behält.
# ablauf: je Thema die Seiten, die der Ablauf des Dienstes in den Korpus nahm (auch über einen Alias des Hauptartikels).

