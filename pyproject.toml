[project]
name = "compendious-text-fastapi"
version = "2.0.0a0"
description = "Kompendium-API v2: kompendiale Texte aus Kiwix-ZIM-Wissen, Lehrplanbezügen und Sammlungsmetadaten"
authors = [{ name = "Jan Schachtschabel", email = "schachtschabel@edu-sharing.net" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
keywords = ["compendium", "kiwix", "zim", "wikipedia", "fastapi", "wirlernenonline"]
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "httpx>=0.28",
    "libzim>=3.13",
    "numpy>=2.0",
    "scikit-learn>=1.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
embeddings = ["model2vec>=0.9"]

[project.scripts]
compendium = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    "mypy>=1.16",
    "types-PyYAML>=6.0",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 licence metadata
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["alterCode"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "T20", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # deutsche Anführungszeichen und Gedankenstriche sind gewollt

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501", "S106"]
"scripts/*" = ["T201"]
"app/cli*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["alterCode/", "scripts/"]

[[tool.mypy.overrides]]
module = ["libzim.*", "sklearn.*", "model2vec.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
# Measured 92 % on 2026-09-18; the gate catches a large untested addition, not every percent
fail_under = 90
skip_covered = true
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-q"]
markers = [
    "live: benötigt echte ZIM-Dumps, Netz oder externe Dienste (deselektieren mit -m 'not live')",
]
