[project]
name = "compendious-text-fastapi"
version = "2.9.1"
description = "Kompendium-API v2: kompendiale Texte aus Kiwix-ZIM-Wissen, Lehrplanbezügen und Sammlungsmetadaten"
authors = [{ name = "Jan Schachtschabel", email = "schachtschabel@edu-sharing.net" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
keywords = ["compendium", "kiwix", "zim", "wikipedia", "fastapi", "wirlernenonline"]
dependencies = [
    "fastapi>=0.116",
    # The service imports both itself (app/main.py, app/api/); fastapi brings them now, which it need not keep doing
    "starlette>=0.46",
    "anyio>=4.0",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "httpx>=0.28",
    "libzim>=3.13",
    "numpy>=2.0",
    "scikit-learn>=1.6",
    "pyyaml>=6.0",
    "prometheus-client>=0.22",
]

[project.optional-dependencies]
# huggingface-hub: the image build downloads the model with snapshot_download (Dockerfile, MODEL2VEC_REVISION)
embeddings = ["model2vec>=0.9", "huggingface-hub>=1.31"]
# spaCy brings the German NER for /api/v2/entities; the model itself is baked into the image (Dockerfile,
# SPACY_MODEL_VERSION). Without the extra the endpoint still answers - with the terms from the archives only.
entities = ["spacy>=3.8"]

[project.scripts]
compendium = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    "mypy>=1.16",
    "types-PyYAML>=6.0",
    "pytest-cov>=6.0",
    "markdown-it-py>=4.2",  # renders the markdown in the tests as a reader would (tests/markdown_safety.py)
    # the client starlette's TestClient takes; with plain httpx it warns and falls back, and a starlette without the
    # fallback would break every test that uses it (audit 2026-09-28, AB-04)
    "httpx2>=2.13",
]
# The build backend, locked with its hashes like every other package. The project builds from this group without
# isolation; isolated, uv fetched hatchling from PyPI at every image build, unhashed, and a bad release could have
# written into the image's environment unseen (audit 2026-09-28, AB-05). editables: hatchling's editable install,
# which uv sync makes outside the image
build = ["hatchling>=1.27", "editables>=0.5"]

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 licence metadata
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev", "build"]
no-build-isolation-package = ["compendious-text-fastapi"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py313"
# The measurement scripts are evidence, kept as they ran, not production code; CI checks app, tests and scripts,
# and without this line the commands of CLAUDE.md failed on them alone (audit 2026-09-27, DO-01)
extend-exclude = ["alterCode", "docs/entwicklung/messung"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "T20", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # deutsche Anführungszeichen und Gedankenstriche sind gewollt

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501", "S106"]
"scripts/*" = ["T201"]
"app/cli*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
# app, scripts and tests are checked (audit 2026-09-29, O2); scripts/ is no package, and a test imports
# scripts.smoke_image, so the module names start at the project root
explicit_package_bases = true
exclude = ["alterCode/"]

[[tool.mypy.overrides]]
module = ["libzim.*", "sklearn.*", "model2vec.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# These tests assert a property, change the state behind it and assert it again. mypy keeps the narrowing of the
# first assertion across the change and calls the second one unreachable
module = [
    "tests.test_lehrplan_store",
    "tests.test_llm_budget",
    "tests.test_llm_resilience",
    "tests.test_local_index_damage",
    "tests.test_pipeline_llm",
    "tests.test_wikidata_index",
]
warn_unreachable = false

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
# Measured 92 % on 2026-09-18; the gate catches a large untested addition, not every percent
fail_under = 90
skip_covered = true
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# No test is marked: b-api, edu-sharing, Kiwix and MEM are covered through fakes and recorded answers (audit
# 2026-09-27, TE-11 - the marker live selected none of them)
addopts = ["--strict-markers", "-q"]
# starlette's and FastAPI's own deprecations fail the tests instead of passing unseen: a release that drops what they
# warn about would otherwise break every test with a TestClient at once. Both warn with UserWarning subclasses of
# their own (audit 2026-09-28, AB-04)
filterwarnings = [
    "error::starlette.exceptions.StarletteDeprecationWarning",
    "error::fastapi.exceptions.FastAPIDeprecationWarning",
    # An SQLite connection nobody closes fails the run: 57 were left open, the indexes of apps never shut down among
    # them (audit 2026-09-29, S1). Python reports one when the collector frees it, so pytest names the test running
    # then, or the end of the run; PYTHONTRACEMALLOC=25 names where it was opened. Other leaks stay Python's default
    "error:unclosed database:ResourceWarning",
    "error:Exception ignored in. .sqlite3.Connection:pytest.PytestUnraisableExceptionWarning",
]
