# Überschriften-Lexikon (PLAN.md, Abschnitt 4.4, Stufe 1).
#
# Wikipedia-Abschnittsüberschriften bilden ein kleines Vokabular. Ein Chunk, dessen
# Überschriftenpfad eines der Muster trifft, wird deterministisch dem Baustein zugeordnet
# (Score 0,9), ohne Themenwissen. Muster sind reguläre Ausdrücke, Groß-/Kleinschreibung
# wird ignoriert, geprüft wird zuerst die tiefste Überschrift, dann die Eltern; die Reihenfolge
# der Bausteine unten entscheidet bei mehreren Treffern (erster gewinnt).
#
# Fassung 3 (2026-09-17): Präfix-Muster je Baustein aus den Verwechslungen des Goldstandards
# (eval/gold, 10 Themen) ergänzt; Wortgrenze verhindert Treffer wie „Entwicklungsumgebung“.
# Fassung 2 (2026-09-17): nachgeschärft mit einer Erhebung über 20.000 Zufallsartikel des
# deutschen Wikipedia-Dumps (scripts/harvest_headings.py, eval/headings_top.csv). Aufgenommen
# wurden nur Überschriften, die in Sachartikeln vorkommen und themenneutral sind; Biografie-,
# Orts-, Sport- und Werkverzeichnis-Überschriften (Leben, Karriere, Lage, Finale, Diskografie)
# bleiben absichtlich unklassifiziert oder werden ausgeschlossen. Themenspezifisches Vokabular
# gehört nicht hierher, sondern in das Template (heading_patterns je Slot).
version: 3

# Überschriften, deren Inhalt nicht als Fließtext übernommen wird. Ihre Einträge
# fließen als Quellenhinweise und Relationen in die generierten Bausteine.
exclude:
  - '^(Einzelnachweise?|Anmerkungen?|Fußnoten|Belege|Einzelbelege|Nachweise|Referenzen|Quellen?|Quellenangaben|Bemerkungen)( und (Anmerkungen|Einzelnachweise|Fußnoten|Weblinks|Quellen|Nachweise))?$'
  - '^(Literatur|Weiterführende Literatur|Weblinks?|Externe Links|Links)( und (Quellen|Weblinks|Literatur))?( \(Auswahl\))?$'
  - '^(Schriften|Werke|Publikationen|Veröffentlichungen|Filmografie|Filmographie|Diskografie|Diskographie|Diskographische Hinweise|Bibliografie|Bibliographie|Monografien|Monographien|Herausgeberschaften?|Textausgaben|Ausgaben|Tondokumente|Studioalben|Livealben|Alben|Singles|EPs|Kompilationen|Hörspiele|Filme|Dokumentationen|Hörfunk|Romane|Erzählungen|Lyrik|Bücher)( \(Auswahl\))?$'
  - '^(Navigationsmenü|Inhaltsverzeichnis|Inhalt|Zeichenerklärung)$'

# Überschriften, die als Relationen zu anderen Themen gewertet werden (Baustein 11).
relations:
  - '^(Siehe auch|Verwandte Themen|Verwandte Begriffe|Verwandte Artikel)$'

slots:
  themendefinition:
    - '^(Definition|Definitionen|Begriffsbestimmung|Begriffsdefinition|Begriffsklärung|Begriff|Abgrenzung|Allgemeines|Allgemein|Überblick|Übersicht|Einleitung|Einführung|Gegenstand|Zusammenfassung|Charakteristik)$'
